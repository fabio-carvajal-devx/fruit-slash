<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fruit Slash</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- full-screen tint layers driven by power-ups -->
  <div id="tint-freeze" class="tint"></div>
  <div id="tint-double" class="tint"></div>
  <div id="tint-frenzy" class="tint"></div>
  <div id="tint-bomb" class="tint"></div>

  <!-- HUD -->
  <div id="hud" hidden>
    <button id="pauseBtn" class="glass-btn round" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.6"/><rect x="14" y="4.5" width="4" height="15" rx="1.6"/></svg>
    </button>
    <div id="clock">
      <div id="clockBar"><i></i></div>
      <span id="clockText">90</span>
    </div>
    <div id="scoreBox"><span id="scoreVal">0</span></div>
    <div id="banner"></div>
  </div>

  <!-- SCREENS -->
  <div id="screens">

    <section id="s-start" class="screen show">
      <h1 class="logo"><span>FRUIT</span><b>SLASH</b></h1>
      <button id="playBtn" class="mega">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg>
        <span>PLAY</span>
      </button>
      <p class="best">BEST <b id="bestStart">0</b><i id="bestName"></i></p>
      <div class="corner-left">
        <button id="scoresBtn" class="glass-btn round tiny" aria-label="High scores">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3v3a4 4 0 01-3.2 3.92A5 5 0 0113 15.9V18h3v3H8v-3h3v-2.1a5 5 0 01-3.8-3.98A4 4 0 014 8V5h3V3zm0 4H6v1a2 2 0 001 1.73V7zm10 0v2.73A2 2 0 0018 8V7h-1z"/></svg>
        </button>
      </div>
      <button id="settingsBtn" class="glass-btn round tiny" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zm9 3.5a8.9 8.9 0 00-.14-1.5l2-1.55-2-3.46-2.38.96a9 9 0 00-2.6-1.5L15.5 2h-4l-.38 2.95a9 9 0 00-2.6 1.5L6.14 5.5l-2 3.46 2 1.55A8.9 8.9 0 004 12c0 .51.05 1.01.14 1.5l-2 1.55 2 3.46 2.38-.96a9 9 0 002.6 1.5L11.5 22h4l.38-2.95a9 9 0 002.6-1.5l2.38.96 2-3.46-2-1.55c.09-.49.14-.99.14-1.5z"/></svg>
      </button>
    </section>

    <section id="s-pause" class="screen">
      <h2>PAUSED</h2>
      <button id="resumeBtn" class="mega">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg>
        <span>RESUME</span>
      </button>
      <div class="row">
        <button id="restartBtn" class="pill">RESTART</button>
        <button id="homeBtn" class="pill ghost">HOME</button>
      </div>
    </section>

    <section id="s-end" class="screen">
      <div id="stars"><i>★</i><i>★</i><i>★</i></div>
      <p class="label">SCORE</p>
      <div id="endScore">0</div>
      <p class="best" id="endRank" hidden></p>
      <ul id="endStats"></ul>
      <ol id="endBoard" class="board"></ol>
      <button id="againBtn" class="mega">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7.5 6.5 12 11V8a5 5 0 11-5 5H4a8 8 0 108-8z"/></svg>
        <span>PLAY AGAIN</span>
      </button>
      <button id="endHomeBtn" class="pill ghost">HOME</button>
    </section>

    <section id="s-settings" class="screen">
      <h2>SETTINGS</h2>
      <div class="opt">
        <span class="opt-label">ROUND</span>
        <div class="seg" id="optTime">
          <button data-v="60">60s</button><button data-v="90">90s</button><button data-v="120">120s</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt-label">BOMBS</span>
        <div class="seg" id="optBombs">
          <button data-v="0">OFF</button><button data-v="1">ON</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt-label">SOUND</span>
        <div class="seg" id="optSound">
          <button data-v="0">OFF</button><button data-v="1">ON</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt-label">SPEED</span>
        <div class="seg" id="optSpeed">
          <button data-v="0">EASY</button><button data-v="1">NORMAL</button><button data-v="2">FAST</button>
        </div>
      </div>
      <button id="closeSettings" class="pill">DONE</button>
    </section>

    <section id="s-name" class="screen">
      <h2 id="nameTitle">NEW RECORD!</h2>
      <p class="label">WHO ARE YOU?</p>
      <div id="nameSlots"></div>
      <button id="nameOk" class="mega"><span>OK</span></button>
    </section>

    <section id="s-scores" class="screen">
      <h2>HIGH SCORES</h2>
      <ol id="scoreBoard" class="board big"></ol>
      <button id="closeScores" class="pill">DONE</button>
    </section>

    <section id="s-count" class="screen bare"><div id="countNum">3</div></section>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
